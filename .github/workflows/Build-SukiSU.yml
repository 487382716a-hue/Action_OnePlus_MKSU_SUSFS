name: Build OnePlus_SukiSU Ultra All
on:
  workflow_dispatch:
    inputs:
      CPU:
        type: choice
        description: "分支"
        required: true
        default: sm8850
        options:
          - sm7550
          - sm7675
          - sm8450
          - sm8475
          - sm8550
          - sm8650
          - sm8750
          - sm8850
      FEIL:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_15
        options:
          - oneplus_nord_ce4_v
          - oneplus_ace_3v_v
          - oneplus_nord_4_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus12_v
          - oneplus_13r
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_pad2_v
          - oneplus_13
          - oneplus_13t
          - oneplus_ace5_pro
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_15
          - GitHub有bug可能不显示最后一项,误使用此项
      CPUD:
        type: choice
        description: "处理器代号"
        required: true
        default: canoe
        options:
          - crow
          - waipio
          - kalama
          - pineapple
          - sun
          - canoe
      ANDROID_VERSION:
        type: choice
        description: "内核安卓版本"
        required: true
        default: android15
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
      KERNEL_VERSION:
       type: choice
       description: "内核版本"
       required: true
       default: "5.15"
       options:
         - "5.10"
         - "5.15"
         - "6.1"
         - "6.6"
         - "6.12"
      BUILD_METHOD:
        type: choice
        description: "编译方式"
        required: true
        default: gki
        options:
          - gki
          - perf
      SUSFS_CI:
        type: boolean
        description: "下载SUSFS模块是否使用CI构建？"
        required: true
        default: true
      VFS:
        type: boolean
        description: "是否启用手动钩子？"
        required: true
        default: true
      KPM:
        type: boolean
        description: "是否启用KPM？"
        required: true
        default: true
      ZRAM:
        type: boolean
        description: "是否启用添加更多的ZRAM算法？"
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # 这个 workflow 原本没有 checkout：GITHUB_WORKSPACE 是空的，所以引用仓库内文件
      # （patches/onep_6.12_susfs_fixup.patch）会报 No such file or directory。
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Show selected inputs debug
        run: |
          echo "Selected CPU: ${{ github.event.inputs.CPU }}"
          echo "Selected FEIL: ${{ github.event.inputs.FEIL }}"
          echo "Selected CPUD: ${{ github.event.inputs.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ github.event.inputs.ANDROID_VERSION }}"
          echo "Selected KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ github.event.inputs.BUILD_METHOD }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected VFS: ${{ github.event.inputs.VFS }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          # 上游 manifest 引用了 CodeLinaro 上已被删除的分支（ks-kernel.lnx.5.0.r3-rel），
          # 每次跑失败的项目是随机的一批：
          #   run 40165292670 → prebuilts/asuite、tools/tradefederation/prebuilts（无害）
          #   run 40169132433 → prebuilts/build-tools、prebuilts/clang、prebuilts/jdk（致命！
          #                    prebuilts/build-tools 缺了就连 py3-cmd 都没有，bazel 一行都跑不了）
          # 所以不能"报错就放行"，必须重试到关键目录真的齐了为止。
          essential_ok() {
            { [ -e kernel_platform/common/BUILD.bazel ] || [ -e kernel_platform/msm-kernel/BUILD.bazel ]; } || return 1
            [ -x kernel_platform/prebuilts/build-tools/linux_musl-x86/bin/py3-cmd ] || return 1
            return 0
          }
          for attempt in 1 2 3; do
            echo "=== repo sync 第 $attempt 次 ==="
            repo sync -j8 || echo "::warning::repo sync 第 $attempt 次返回非 0（上游坏 ref，属常态）"
            if essential_ok; then echo "[ok] 关键目录齐全（第 $attempt 次）"; break; fi
            echo "关键目录仍有缺失，10s 后重试"
            sleep 10
          done
          if ! essential_ok; then
            echo "::error::repo sync 三次后关键目录仍缺失"
            ls -d kernel_platform/prebuilts/build-tools 2>/dev/null || echo "  prebuilts/build-tools 不存在"
            ls -l kernel_platform/prebuilts/build-tools/linux_musl-x86/bin 2>/dev/null | head -20
            echo "--- 各 project HEAD 检查（没同步下来的会打印 MISSING） ---"
            repo forall -c 'git rev-parse --verify -q HEAD >/dev/null || echo "MISSING HEAD: $REPO_PATH"' 2>&1 | head -40 || true
            exit 1
          fi
          # 注意：oneplus_15 等纯 GKI manifest 只有 kernel_platform/common，没有 msm-kernel。
          # 把两个目录一起喂给 ls 会因其中一个缺失而返回非 0，在 bash -e 下会中断整步。
          echo "kernel source dirs:"
          for d in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -d "$d" ]; then echo "  present: $d"; else echo "  absent : $d"; fi
          done
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

          # kleaf 的 check_defconfig 会把 gki_defconfig 和 savedefconfig 的结果逐行比对。
          # 本树原版 gki_defconfig 里的 CONFIG_KALLSYMS_ALL 就已经不是 savedefconfig 形态，
          # 再叠加我们追加的 CONFIG_KSU*，这个断言必然失败（同一文件里 kernel_aarch64_tv 也是 disabled）。
          # 只关掉这个断言，实际生效的 config 完全不变。
          if [ -f kernel_platform/common/BUILD.bazel ]; then
          python3 - <<'PY'
          p = 'kernel_platform/common/BUILD.bazel'
          s = open(p).read()
          needle = '    name = "kernel_aarch64",\n'
          patched = needle + '    check_defconfig = "disabled",\n'
          if patched in s:
              print('check_defconfig already disabled for kernel_aarch64')
          else:
              assert needle in s, 'kernel_aarch64 rule not found in BUILD.bazel'
              open(p, 'w').write(s.replace(needle, patched, 1))
              print('check_defconfig disabled for kernel_aarch64')
          PY
          fi

      # 删除 -dirty 后缀
      - name: Force remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          # msm-kernel 在纯 GKI manifest 中不存在，逐个判断，避免某一项缺失导致整步中断
          for f in common/scripts/setlocalversion msm-kernel/scripts/setlocalversion external/dtc/scripts/setlocalversion; do
            if [ -f "$f" ]; then
              sed -i 's/ -dirty//g' "$f"
              echo "patched: $f"
            else
              echo "skip (absent): $f"
            fi
          done
          if [ -f common/scripts/setlocalversion ]; then
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          fi
          # 只有在 kernel_platform 自己就是 git 根时才提交。纯 GKI 树里它只是外层仓库的子目录，
          # 直接 git add -A 会把整棵内核树加进外层仓库（既慢又无意义）。
          TOPLEVEL=$(git rev-parse --show-toplevel 2>/dev/null || true)
          if [ "$TOPLEVEL" = "$PWD" ]; then
            git add -A || true
            git commit -m "Force remove -dirty suffix from kernel version" || true
          else
            echo "skip git commit: kernel_platform is not a git root (toplevel=${TOPLEVEL:-none})"
          fi

      # 添加 SukiSU Ultra
      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      # setup.sh 的 `builtin` 参数其实是 git 分支名，检出的是老一代 KernelSU 驱动，
      # 只适配到 6.1 左右。在一加 6.12 树上有两处源码级不兼容（编译器实测）：
      #   1) security_add_hooks() 自 6.12 起第三个参数由 const char * 改为 const struct lsm_id *
      #      error: incompatible pointer types passing 'char[4]' to parameter of type 'const struct lsm_id *'
      #   2) netlink_kernel_cfg 自 6.12 起删掉了 cb_mutex 字段（KPM 的字段偏移表还在引用它）
      #      error: no member named 'cb_mutex' in 'struct netlink_kernel_cfg'
      #      连带 invalid application of 'sizeof' to an incomplete type 'struct DynamicStructMember[]'
      # 这里按 6.12 真实头文件做最小适配（只加版本分支，不动原有逻辑，不影响其它内核版本）。
      - name: Patch SukiSU driver for 6.12
        run: |
          cd kernel_workspace/kernel_platform/KernelSU
          python3 - <<'PY'
          import io, sys

          def read(p):
              with io.open(p, encoding='utf-8') as f:
                  return f.read()

          def write(p, s):
              with io.open(p, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(s)

          # ---- 1) lsm_hook.c：security_add_hooks() 的 lsm_id ----
          p = 'kernel/hook/lsm_hook.c'
          s = read(p)
          if 'ksu_lsmid' in s:
              print('[patch] lsm_hook.c already patched')
          else:
              anchor = 'void __init ksu_lsm_hook_init(void)\n{\n'
              if anchor not in s:
                  sys.exit('FATAL: ksu_lsm_hook_init anchor not found in %s' % p)
              decl = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n'
                      'static struct lsm_id ksu_lsmid = {\n'
                      '    .name = "ksu",\n'
                      '    .id = 1000,\n'
                      '};\n'
                      '#endif\n\n')
              old = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n'
                     '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");')
              new = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 12, 0)\n'
                     '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n'
                     '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 11, 0)\n'
                     '    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");')
              if old not in s:
                  sys.exit('FATAL: security_add_hooks call site not found in %s' % p)
              s = s.replace(anchor, decl + anchor, 1).replace(old, new, 1)
              write(p, s)
              print('[patch] lsm_hook.c: security_add_hooks(..., &ksu_lsmid) for 6.12+')

          # ---- 2) KPM super_access.c：netlink_kernel_cfg.cb_mutex 在 6.12 已删除 ----
          p = 'kernel/extension/kpm/super_access.c'
          s = read(p)
          old = 'DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)\n'
          if old not in s:
              print('[patch] super_access.c: cb_mutex already guarded/absent, skip')
          else:
              new = ('#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 12, 0)\n'
                     'DEFINE_MEMBER(netlink_kernel_cfg, cb_mutex)\n'
                     '#endif\n')
              write(p, s.replace(old, new, 1))
              print('[patch] super_access.c: cb_mutex guarded out for 6.12+')

          # ---- 校验，避免"打了但没生效" ----
          assert '&ksu_lsmid' in read('kernel/hook/lsm_hook.c')
          print('[ok] SukiSU 6.12 compat applied')
          PY
          cd ..
          # ---- 把 kernelsu 从相对软链接换成实体目录 ----
          # setup.sh 建的是相对软链接：common/drivers/kernelsu -> ../../../KernelSU/kernel。
          # oplus_build_kernel.sh 在模块阶段会把 common 整棵树拷到
          #   out/target/product/<chip>/obj/DLKM_OBJ/kernel_platform/super_kernel/
          # 再在里面跑 `make O=... dtbs olddefconfig`。软链接换了目录深度就悬空，于是：
          #   drivers/Kconfig:248: can't open file "drivers/kernelsu/Kconfig"
          # 内核镜像本身已编成功，是这一步把整轮拉挂的。实体目录在两种拷贝（跟链/不跟链）下都成立。
          rm -f common/drivers/kernelsu
          cp -a KernelSU/kernel common/drivers/kernelsu
          [ -f common/drivers/kernelsu/hook/lsm_hook.c ] || {
            echo "::error::failed to materialize common/drivers/kernelsu"; exit 1; }
          grep -q 'ksu_lsmid' common/drivers/kernelsu/hook/lsm_hook.c || {
            echo "::error::patched lsm_hook.c not carried into common/drivers/kernelsu"; exit 1; }
          echo "[ok] common/drivers/kernelsu is a real directory now"

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cd kernel_platform
          echo "正在给内核打susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          echo "正在给内核打zram补丁"
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-${{ github.event.inputs.ANDROID_VERSION }}-${{ github.event.inputs.KERNEL_VERSION }}.patch || true

          # 上面这步带了 `|| true`：补丁是按 Google GKI 6.12 生成的，OnePlus 的 6.12 在
          # fs/exec.c（include 区）和 fs/proc/task_mmu.c（show_smap / show_smaps_rollup）上有差异，
          # 会有 4 个 hunk 打不上而被静默跳过。下面用按本树真实源码重生成的补丁补齐这 4 处，
          # 并且严格校验（不打 `|| true`）——exec.c 少一个 include、task_mmu 少两个隐藏钩子，
          # 都会让编译失败或让 SUSFS 的 maps 隐藏失效。
          echo "补齐 SUSFS 补丁在 OnePlus 6.12 树上未应用的 4 个 hunk"
          patch -p1 -F 3 < "$GITHUB_WORKSPACE/patches/onep_6.12_susfs_fixup.patch"
          grep -q 'linux/susfs_def.h' fs/exec.c
          grep -q 'SUSFS_IS_INODE_SUS_MAP' fs/proc/task_mmu.c
          echo "完成"

      - name: Apply Hide Stuff Patches
        # 6.12 起 show_map_vma() 被重写过（改用 get_vma_name()，没有局部变量 file，
        # 也没有 done / bypass 标签）。69_hide_stuff.patch 的 task_mmu 段仍能"打上"，
        # 但插入的代码引用了不存在的 file / done / bypass，编译必定报错：
        #   error: use of undeclared identifier 'file'
        # 所以只对 6.12 以前的内核应用；6.12 上跳过（若需要 6.12 版本要单独重写这几处）。
        if: ${{ github.event.inputs.KERNEL_VERSION != '6.12' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"
          # 该补丁含两个文件：
          #   fs/proc/task_mmu.c —— 伪造 jit-zygote-cache / lineage 的 maps 行（有用，必须打）
          #   fs/proc/base.c     —— 只对 map_files 里名为 lineage 的条目做伪装（面向 lineage ROM），
          #                         上下文与本树不匹配会导致整步失败，且对 stock ColorOS 无实际作用
          # 所以只取 task_mmu.c 那一段来打。
          python3 - <<'PY'
          import re
          txt = open('69_hide_stuff.patch').read()
          blocks = re.split(r'(?m)^(?=--- a/)', txt)
          keep = [b for b in blocks if b.startswith('--- a/fs/proc/task_mmu.c')]
          assert keep, 'task_mmu.c hunk not found in 69_hide_stuff.patch'
          open('69_hide_task_mmu.patch', 'w').write(''.join(keep))
          print('filtered bytes:', len(''.join(keep)))
          PY
          patch -p1 -F 3 < 69_hide_task_mmu.patch

      - name: Apply LZ4KD
        run: |
          cd kernel_workspace/kernel_platform/common
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/${{ github.event.inputs.KERNEL_VERSION }}/lz4kd.patch ./
            echo "正在打lz4kd补丁"
            patch -p1 -F 3 < lz4kd.patch || true
            echo '完成LZ4KD补丁'
          fi

      # 配置信息
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ github.event.inputs.KERNEL_VERSION }}"

          # 下面追加的 CONFIG_KSU* 只有在 Kconfig 接线存在时才会生效，否则会被 kconfig 静默忽略，
          # 编出一个"看起来成功、其实没有 KSU/SUSFS"的内核。先断言接线。
          grep -q 'drivers/kernelsu/Kconfig' ./common/drivers/Kconfig || {
            echo "::error::KernelSU Kconfig is not sourced from common/drivers/Kconfig"; exit 1; }
          [ -d ./common/drivers/kernelsu ] || {
            echo "::error::common/drivers/kernelsu symlink missing"; exit 1; }
          grep -q 'KSU_SUSFS' ./common/drivers/kernelsu/Kconfig || {
            echo "::error::KSU_SUSFS options not found in kernelsu Kconfig"; exit 1; }
          echo "KernelSU/SUSFS Kconfig wiring OK"

          # SukiSU Ultra config
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"

          # SUSFS config
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

          # LZ4KD配置
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM=y" >> "$CONFIG_FILE"
              echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZO=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.12" ] && [ "${{ github.event.inputs.KERNEL_VERSION }}" != "5.10" ]; then
              if grep -q "CONFIG_ZSMALLOC" -- "$CONFIG_FILE"; then
                sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
              else
                echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              fi
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.6" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "6.12" ]; then
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
            fi

            if [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android14" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android15" ] || [ "${{ github.event.inputs.ANDROID_VERSION }}" = "android16" ]; then
              if [  -e ./common/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
              fi

              if [  -e ./msm-kernel/modules.bzl ]; then
                sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
                echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
                echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/${{ github.event.inputs.CPUD }}-GKI.config"
              fi
              
              echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"
            elif [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.10" ] || [ "${{ github.event.inputs.KERNEL_VERSION }}" = "5.15" ]; then
              rm "common/android/gki_aarch64_modules"
              touch "common/android/gki_aarch64_modules"
            fi

            if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
              echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
              echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
              echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
            fi
          fi

      - name: Build kernel
        if: ${{ github.event.inputs.CPU == 'sm8650' || github.event.inputs.CPU == 'sm7675' }}
        run: |
          cd kernel_workspace
          ./kernel_platform/build_with_bazel.py -t ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }}
          
      - name: Fallback build kernel
        if: ${{ github.event.inputs.CPU != 'sm8650' && github.event.inputs.CPU != 'sm7675' }}
        run: |
         cd kernel_workspace
         # 不能传 LTO=thin：本树的 oplus_setup 会把它展开成 build_with_bazel.py 的 --lto，
         # 而该脚本直接报 "--lto is not supported now, please remove" 后退出。
         # 更麻烦的是 oplus_build_kernel.sh 吞掉了这个错误、仍然返回 0（步骤显示成功但 out/ 是空的），
         # 所以这里必须自己断言产物存在。
         SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ github.event.inputs.CPUD }} ${{ github.event.inputs.BUILD_METHOD }}
         # 已经 cd kernel_workspace，所以这里是 kernel_platform/out（原来写成
         # kernel_workspace/kernel_platform/out，路径多一层，find 永远空 → 必然报假错）
         # oplus 流程除了 dist 之外还可能把 Image 拷进 device/qcom/<chip>-kernel，一并找。
         IMG=$(find kernel_platform/out kernel_platform/bazel-out device/qcom \
                     -type f -name Image 2>/dev/null | head -n 1)
         if [ -z "$IMG" ]; then
           echo "::error::kernel build finished but produced no Image, see the log above"
           exit 1
         fi
         echo "IMAGE_PATH=$IMG" >> "$GITHUB_ENV"

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          # 不同 SoC / 构建方式的产物目录名不一样（-gki / -perf / bazel-out / gki_kernel…），
          # 原来硬编码 5 条路径，sm8850 的 oplus 构建实际落在 -perf 上，全部落空。
          # 这里直接定位 Image，再反推 dist 目录，后续步骤统一用 DIST_DIR。
          # 上一步已经找到了 Image 并写进 IMAGE_PATH；优先用它，避免这里再猜一遍目录。
          if [ -n "${IMAGE_PATH:-}" ] && [ -f "${IMAGE_PATH:-}" ]; then
            echo "Image 复用上一步定位结果: $IMAGE_PATH"
          else
            IMAGE_PATH=$(find kernel_workspace/kernel_platform/out \
                              kernel_workspace/kernel_platform/bazel-out \
                              kernel_workspace/device/qcom \
                              -type f -name Image 2>/dev/null | head -n 1)
          fi

          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::no Image found under kernel_platform/{out,bazel-out} or device/qcom"
            ls -d kernel_workspace/kernel_platform/out/* 2>/dev/null || echo "(out 目录不存在)"
            exit 1
          fi

          DIST_DIR=$(dirname "$IMAGE_PATH")
          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV
          echo "Image: $IMAGE_PATH"
          cp "$IMAGE_PATH" ./AnyKernel3/Image

          # 不要再把 dtbo.img / vendor_boot.img / vendor_dlkm.img / system_dlkm.img 塞进包里。
          # 依据：Numbersf/AnyKernel3 的 anykernel.sh 全文只有 split_boot / unpack_ramdisk /
          # write_boot / flash_boot，BLOCK=boot，**一处都没有引用这四个文件**——它们占 ~104 MB
          # 却永远不会被刷入；真要刷也只会把厂商 vendor 分区整块覆盖成 CI 产物，风险更高。
          # 上一版 142 MB 里有 4/5 是这类死重量，只保留 Image 后 ≈20 MB（cctv18 那条流水线同理）。

      - name: Apply patch_linux and replace Image
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          # DIST_DIR 由上一步探测并写入 $GITHUB_ENV，不再硬编码目录名
          cd "$DIST_DIR"

          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux || echo "::warning::patch_linux 返回非 0，继续检查是否产出了 oImage"
          if [ -f oImage ]; then
            rm -f Image
            mv oImage Image
            cp Image "$GITHUB_WORKSPACE"/AnyKernel3/Image
            echo "Image 已打 KPM 补丁"
          else
            echo "::warning::没有 oImage，Image 保持未打补丁 —— KPM 不可用，其它功能不受影响"
          fi

      # 下载 SUSFS 模块（CI）
      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'true' }}
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)

          if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" = "null" ]; then
            echo "::warning::上游 v1.5.2+ 分支没有成功的 CI 运行，跳过该附属模块"
            exit 0
          fi

          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')

          # 这个 zip 只是塞进卡刷包的可选附属模块；编内核已经花了大半小时，
          # 不该因为它下不来而丢掉整轮产物。失败就明确告警并继续。
          # anykernel.sh 按固定文件名找模块：
          #   ksu_module_susfs_1.5.2+_Release.zip / ksu_module_susfs_1.5.2+_CI.zip
          # 之前存成 ksu_module_susfs.zip，名字对不上 → 刷机时永远走 "No SUSFS Module found"
          if curl -fL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"; then
            cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/ && echo "SUSFS 模块（CI）已放入卡刷包"
          else
            echo "::warning::SUSFS 模块下载失败（上游 CI 产物权限/分支名变动），本轮不带该附属模块"
            rm -f ksu_module_susfs_1.5.2+_CI.zip
          fi

      # 下载 SUSFS 模块（Release）
      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'false' }}
        run: |
          if wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip; then
            # 同 CI 分支：必须用 anykernel.sh 认识的文件名，否则模块装不上
            mv ksu_module_susfs_1.5.2+.zip ksu_module_susfs_1.5.2+_Release.zip
            cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/
          else
            echo "::warning::SUSFS 模块（Release）下载失败，本轮不带该附属模块"
          fi

      # 打包后的守门检查：内核在、废重不在。之前靠人肉发现"142 MB 里有 4/5 是死文件"，
      # 加断言以后回归会当场报错，不会再悄悄产出一个臃肿包。
      - name: Verify AnyKernel3 contents
        run: |
          if [ ! -f AnyKernel3/Image ]; then
            echo "::error::AnyKernel3/Image 缺失"
            exit 1
          fi
          for f in dtbo.img vendor_boot.img vendor_dlkm.img system_dlkm.img; do
            if [ -f "AnyKernel3/$f" ]; then
              echo "::error::$f 又被塞进包里了（anykernel.sh 根本不引用它）"
              exit 1
            fi
          done
          echo "--- 包内文件 ---"
          ls -l AnyKernel3
          echo "--- 总体积 ---"
          du -sh AnyKernel3

      - name: Set suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.KPM == 'true' && '_KPM' || '' }}${{ github.event.inputs.VFS == 'true' && '_VFS' || '' }}${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}" >> $GITHUB_OUTPUT

      - name: Remove _uv suffix from FEIL
        id: feil_clean
        run: |
          clean_feil="${{ github.event.inputs.FEIL }}"
          clean_feil="${clean_feil%_v}"  # 去掉结尾的 _v（如果有）
          clean_feil="${clean_feil%_u}"  # 去掉结尾的 _u（如果有）
          echo "value=$clean_feil" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.feil_clean.outputs.value }}${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*
